<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language},dir=${#locale.language}=='ar'?'rtl':'ltr'">
<head>
    <title th:text="#{change.password}">Change Password</title>

    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
    <meta charset="UTF-8">
</head>

<body topmargin="0" leftmargin="0">
<div th:replace="~{fragments/common-header :: common-header}"></div>

<table width="100%" border="0" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">

            <table width="40%" class="panel inl-10ebd341ab" cellpadding="8">

                <tr class="panel-header">
                    <td align="center" th:text="#{change.password}">Change Password</td>
                </tr>

                <tr th:if="${success}">
                    <td align="center" class="message-success" th:text="${success}"></td>
                </tr>

                <tr>
                    <td class="panel-body">
                        <form th:action="@{/change-password}"
                              method="post"
                              th:object="${changePasswordForm}">

                            <!-- CSRF -->
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>

                            <div th:if="${#fields.hasGlobalErrors()}" class="message-error inl-761d3addb2">
                                <ul class="inl-af81c60b31">
                                    <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                                </ul>
                            </div>

                            <table width="100%" cellpadding="6">
                                <tr>
                                    <td align="right"><b th:text="#{old.password}">Old Password:</b></td>
                                    <td>
                                        <input type="password"
                                               th:field="*{oldPassword}">
                                                                                        <div th:if="${#fields.hasErrors('oldPassword')}" class="message-error inl-5e0faad207" th:errors="*{oldPassword}"></div>
                                    </td>
                                </tr>

                                <tr>
                                    <td align="right"><b th:text="#{new.password}">New Password:</b></td>
                                    <td>
                                        <input type="password"
                                               th:field="*{newPassword}">
                                            <div th:if="${error}" class="message-error inl-761d3addb2" th:text="${error}"></div>
                                        <div th:if="${#fields.hasErrors('newPassword')}" class="message-error inl-5e0faad207" th:errors="*{newPassword}"></div>
                                    </td>
                                </tr>

                                <tr>
                                    <td align="right"><b th:text="#{confirm.password}">Confirm Password:</b></td>
                                    <td>
                                        <input type="password"
                                               th:field="*{confirmPassword}">
                                        <div th:if="${#fields.hasErrors('confirmPassword')}" class="message-error inl-5e0faad207" th:errors="*{confirmPassword}"></div>
                                    </td>
                                </tr>

                                <tr>
                                    <td colspan="2" align="center">
                                        <br>
                                        <button type="submit" th:text="#{change.password}">Change Password</button>
                                        &nbsp;&nbsp;
                                        <a th:href="@{/user-options}" th:text="#{cancel}">Cancel</a>
                                    </td>
                                </tr>
                            </table>

                        </form>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
<div th:replace="~{fragments/common-footer :: common-footer}"></div>
</html>
