<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language},dir=${#locale.language}=='ar'?'rtl':'ltr'" th:classappend="${#locale.language}=='ar'?'rtl':'ltr'">
<head>
    <title th:text="${author.firstName + ' ' + author.lastName}">Author Summary</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
    <meta charset="UTF-8">
</head>
<body th:classappend="${#locale.language}=='ar'?'rtl':'ltr'">
<div th:replace="~{fragments/common-header :: common-header}"></div>

<div class="classic-summary-wrap">
    <h1 class="classic-summary-title" th:text="${author.firstName + ' ' + author.lastName}">Author Name</h1>
    <hr class="classic-summary-divider">

    <div th:if="${categories == null || #lists.isEmpty(categories)}" class="classic-summary-empty" th:text="#{no.books.found.for.author.search}">No books found for this author.</div>

    <div th:if="${categories != null && !#lists.isEmpty(categories)}">
        <div class="classic-summary-row" th:each="cat : ${categories}">
            <div class="classic-summary-category" th:text="${cat.categoryName}">Category Name</div>
            <div class="classic-summary-meta">
                <a class="classic-summary-books"
                   th:href="@{/books(authorId=${author.id},categoryId=${cat.categoryId},returnTo=${'/authors/' + author.id})}"
                   th:text="${cat.bookCount} + ' ' + #{books.suffix}">
                    0 book(s)
                </a>
                <a class="classic-summary-view"
                   th:href="@{/books(authorId=${author.id},categoryId=${cat.categoryId},returnTo=${'/authors/' + author.id})}"
                   th:text="#{view}">
                    View
                </a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/common-footer :: common-footer}"></div>

</body>
</html>
