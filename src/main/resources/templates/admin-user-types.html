<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language},dir=${#locale.language}=='ar'?'rtl':'ltr'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{usertypes.manager}">User Types Manager</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
    
</head>
<body>
<div th:replace="~{fragments/common-header :: common-header}"></div>

<div class="table-container">
    <div th:if="${success}" class="message success">[[${success}]]</div>
    <div th:if="${error}" class="message error">[[${error}]]</div>
    <div th:if="${noSelection}" class="message error" th:text="#{admin.action.delete.noselection}">Please select at least one record to delete.</div>
    <div th:if="${userTypes == null || #lists.isEmpty(userTypes)}" class="message error" th:text="#{no.user.types.found}">No user types found.</div>

    <form method="post" th:action="@{/admin/user-types/delete}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="table-title" th:text="#{user.types}">User Types</div>
        <table class="table-shell">
            <thead>
            <tr>
                <th class="usertype-col-heading" th:classappend="${#locale.language}=='ar'?'rtl-col-heading':''"></th>
                <th class="usertype-col-heading" th:classappend="${#locale.language}=='ar'?'rtl-col-heading':''">
                    <a th:href="@{/admin/user-types(page=0,size=${pageSize},sort='type',direction=${sort == 'type' and direction == 'asc' ? 'desc' : 'asc'})}">
                        <span th:text="#{name}">Name</span>
                        <span class="sort-icon" aria-hidden="true"
                              th:text="${sort == 'type' ? (direction == 'asc' ? '▲' : '▼') : '↕'}">↕</span>
                    </a>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="type : ${userTypes}">
                <td><input type="checkbox" name="userTypeIds" th:value="${type.id}" /></td>
                <td><a th:href="@{'/admin/user-types/edit/' + ${type.id}}" class="table-link" th:text="${type.type}">Type</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(userTypes)}">
                <td colspan="2" th:text="#{no.user.types.found}">No user types found.</td>
            </tr>
            </tbody>
        </table>
        <div class="action-row admin-table-actions-center">
            <a class="btn-inline" th:href="@{/admin/user-types/add}" th:text="#{add}">Add</a>
            <button class="btn-inline secondary btn-delete" type="submit" th:text="#{delete}">Delete</button>
        </div>
    </form>
    <div class="admin-pagination" th:if="${totalPages != null && totalPages > 1}">
        <a th:if="${pageNumber > 0}" th:href="@{/admin/user-types(page=${pageNumber-1},size=${pageSize},sort=${sort},direction=${direction})}" th:text="#{previous}">Previous</a>
        <span th:text="#{page}">Page</span> <span th:text="${pageNumber + 1}">1</span> <span th:text="#{of}">of</span> <span th:text="${totalPages}">1</span>
        <a th:if="${pageNumber + 1 < totalPages}" th:href="@{/admin/user-types(page=${pageNumber+1},size=${pageSize},sort=${sort},direction=${direction})}" th:text="#{next}">Next</a>
    </div>
</div>

<div th:replace="~{fragments/common-footer :: common-footer}"></div>
</body>
</html>
