<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language},dir=${#locale.language}=='ar'?'rtl':'ltr'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{authors.manager}">Authors Manager</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
    
</head>
<body>
<div th:replace="~{fragments/common-header :: common-header}"></div>

<div class="table-container">
    <div th:if="${success}" class="message success">[[${success}]]</div>
    <div th:if="${error}" class="message error">[[${error}]]</div>
    <div th:if="${noSelection}" class="message error" th:text="#{admin.action.delete.noselection}">Please select at least one record to delete.</div>
    <div th:if="${authors == null || #lists.isEmpty(authors)}" class="message error" th:text="#{no.authors.found}">No authors found.</div>

    <form method="post" th:action="@{/admin/authors/delete}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="table-title" th:text="#{author.list}">Author List</div>
        <table class="table-shell">
            <thead>
            <tr>
                <th class="inl-82eb62afb6"></th>
                <th class="author-col-heading" th:classappend="${#locale.language}=='ar'?'rtl-col-heading':''">
                    <a th:href="@{/admin/authors(page=0,size=${pageSize},sort='firstName',direction=${sort == 'firstName' and direction == 'asc' ? 'desc' : 'asc'})}">
                        <span th:text="#{first.name}">First Name</span>
                        <span class="sort-icon" aria-hidden="true"
                              th:text="${sort == 'firstName' ? (direction == 'asc' ? '▲' : '▼') : '↕'}">↕</span>
                    </a>
                </th>
                <th class="author-col-heading" th:classappend="${#locale.language}=='ar'?'rtl-col-heading':''">
                    <a th:href="@{/admin/authors(page=0,size=${pageSize},sort='lastName',direction=${sort == 'lastName' and direction == 'asc' ? 'desc' : 'asc'})}">
                        <span th:text="#{last.name}">Last Name</span>
                        <span class="sort-icon" aria-hidden="true"
                              th:text="${sort == 'lastName' ? (direction == 'asc' ? '▲' : '▼') : '↕'}">↕</span>
                    </a>
                </th>
                <th class="author-col-heading" th:classappend="${#locale.language}=='ar'?'rtl-col-heading':''">
                    <a th:href="@{/admin/authors(page=0,size=${pageSize},sort='email',direction=${sort == 'email' and direction == 'asc' ? 'desc' : 'asc'})}">
                        <span th:text="#{email}">Email</span>
                        <span class="sort-icon" aria-hidden="true"
                              th:text="${sort == 'email' ? (direction == 'asc' ? '▲' : '▼') : '↕'}">↕</span>
                    </a>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="author : ${authors}">
                <td><input type="checkbox" name="authorIds" th:value="${author.id}" /></td>
                <td><a th:href="@{'/admin/authors/edit/' + ${author.id}}" class="table-link" th:text="${author.firstName}">First</a></td>
                <td th:text="${author.lastName}">Last</td>
                <td th:text="${author.email}">email</td>
            </tr>
            <tr th:if="${#lists.isEmpty(authors)}">
                <td colspan="4" th:text="#{no.authors.found}">No authors found.</td>
            </tr>
            </tbody>
        </table>
        <div class="action-row admin-table-actions-center">
            <a class="btn-inline" th:href="@{/admin/authors/add}" th:text="#{add}">Add</a>
            <button class="btn-inline secondary btn-delete" type="submit" th:text="#{delete}">Delete</button>
        </div>
    </form>
    <div class="admin-pagination" th:if="${totalPages != null && totalPages > 1}">
        <a th:if="${pageNumber > 0}" th:href="@{/admin/authors(page=${pageNumber-1},size=${pageSize},sort=${sort},direction=${direction})}" th:text="#{previous}">Previous</a>
        <span th:text="#{page}">Page</span> <span th:text="${pageNumber + 1}">1</span> <span th:text="#{of}">of</span> <span th:text="${totalPages}">1</span>
        <a th:if="${pageNumber + 1 < totalPages}" th:href="@{/admin/authors(page=${pageNumber+1},size=${pageSize},sort=${sort},direction=${direction})}" th:text="#{next}">Next</a>
    </div>
</div>

<div th:replace="~{fragments/common-footer :: common-footer}"></div>
</body>
</html>
