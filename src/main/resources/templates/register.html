<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language},dir=${#locale.language}=='ar'?'rtl':'ltr'">
<head>
    <meta charset="UTF-8">
    <title th:text="#{register.title}">Register | Book Portal</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}" href="/style.css">
</head>


<body class="auth-centered-page">
    <div class="welcome-container inl-93f1f3eda4">
        <div class="inl-6c529a0b2e">
            <form method="get" id="langChangeForm" class="inl-25b5288699">
                <select name="lang" onchange="document.getElementById('langChangeForm').submit()" class="inl-f261655b5c">
                    <option th:value="en" th:selected="${#locale.language == 'en'}">English</option>
                    <option th:value="ar" th:selected="${#locale.language == 'ar'}">العربية</option>
                    <option th:value="fr" th:selected="${#locale.language == 'fr'}">Français</option>
                    <option th:value="es" th:selected="${#locale.language == 'es'}">Español</option>
                </select>
            </form>
        </div>
        <div class="welcome-title inl-87fbca988e" th:text="#{register.title}">Create Your Account</div>
        <div class="welcome-desc inl-4ff3801f7e">
            <span th:text="#{register.desc}">Register to explore books by title and category, view related authors and publishers, and manage your account.</span>
        </div>
        <form th:action="@{/register}" method="post" th:object="${registerForm}" class="inl-ef0b7a1148" th:classappend="${#locale.language}=='ar'?'rtl':''">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div th:if="${#fields.hasGlobalErrors()}" class="message-error inl-761d3addb2">
                <ul class="inl-0942cb3e50">
                    <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                </ul>
            </div>
            <div th:if="${error}" class="message-error inl-761d3addb2">
                <p th:text="${error}"></p>
            </div>
            <div th:classappend="${#locale.language}=='ar'?'rtl':''" class="inl-ed0e4a7f52">
                <label th:text="#{first.name}" class="inl-39e200034f">First Name:</label><br>
                <input type="text" th:field="*{firstName}" class="inl-9ec2f25594">
                <div th:if="${#fields.hasErrors('firstName')}" class="message-error inl-cfe92f3ae5" th:errors="*{firstName}"></div>
            </div>
            <div th:classappend="${#locale.language}=='ar'?'rtl':''" class="inl-ed0e4a7f52">
                <label th:text="#{last.name}" class="inl-39e200034f">Last Name:</label><br>
                <input type="text" th:field="*{lastName}" class="inl-9ec2f25594">
                <div th:if="${#fields.hasErrors('lastName')}" class="message-error inl-cfe92f3ae5" th:errors="*{lastName}"></div>
            </div>
            <div th:classappend="${#locale.language}=='ar'?'rtl':''" class="inl-ed0e4a7f52">
                <label th:text="#{email}" class="inl-39e200034f">E-Mail Address:</label><br>
                <input type="text" th:field="*{email}" class="inl-9ec2f25594">
                <div th:if="${#fields.hasErrors('email')}" class="message-error inl-cfe92f3ae5" th:errors="*{email}"></div>
            </div>
            <div th:classappend="${#locale.language}=='ar'?'rtl':''" class="inl-ed0e4a7f52">
                <label th:text="#{username}" class="inl-39e200034f">User Name:</label><br>
                <input type="text" th:field="*{username}" class="inl-9ec2f25594">
                <div th:if="${#fields.hasErrors('username')}" class="message-error inl-cfe92f3ae5" th:errors="*{username}"></div>
            </div>
            <div th:classappend="${#locale.language}=='ar'?'rtl':''" class="inl-ed0e4a7f52">
                <label th:text="#{password}" class="inl-39e200034f">Password:</label><br>
                <input type="password" th:field="*{password}" class="inl-9ec2f25594">
                <div th:if="${#fields.hasErrors('password')}" class="message-error inl-cfe92f3ae5" th:errors="*{password}"></div>
            </div>
            <div class="inl-ed0e4a7f52">
                <label th:text="#{reenter.password}" class="inl-39e200034f">Re-enter Password:</label><br>
                <input type="password" th:field="*{confirmPassword}" class="inl-9ec2f25594">
                <div th:if="${#fields.hasErrors('confirmPassword')}" class="message-error inl-cfe92f3ae5" th:errors="*{confirmPassword}"></div>
            </div>
            <div class="inl-ed0e4a7f52">
                <label th:text="#{secret.question}" class="inl-39e200034f">Secret Question:</label><br>
                <select th:field="*{secretQuestionId}" class="inl-9ec2f25594">
                    <option value="" th:text="#{select.question}">-- Select a Question --</option>
                    <option th:each="question : ${secretQuestions}" th:value="${question.id}" th:text="#{${question.question}}"></option>
                </select>
                <div th:if="${#fields.hasErrors('secretQuestionId')}" class="message-error inl-cfe92f3ae5" th:errors="*{secretQuestionId}"></div>
            </div>
            <div class="inl-9704196b52">
                <label th:text="#{secret.answer}" class="inl-39e200034f">Secret Answer:</label><br>
                <input type="text" th:field="*{secretAnswer}" class="inl-9ec2f25594">
                <div th:if="${#fields.hasErrors('secretAnswer')}" class="message-error inl-cfe92f3ae5" th:errors="*{secretAnswer}"></div>
            </div>
            <div class="inl-23f8c75fb0">
                <button type="submit" id="register-submit" th:text="#{register}" class="inl-02f8879a91">Register</button>
                <a th:href="@{/}" th:text="#{cancel}" class="inl-6fa35d23a4">Cancel</a>
            </div>
        </form>
    </div>

</body>
</html>
