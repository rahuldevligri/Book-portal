<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" th:attr="lang=${#locale.language},dir=${#locale.language}=='ar'?'rtl':'ltr'">
<head>
    <title th:text="#{forgot.login}">Forgot Login</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
    
</head>
<body class="auth-centered-page">

<div class="centered-box">
    <h2 th:text="#{forgot.login}" class="inl-cc3db2fab3">Forgot Login</h2>
    <form th:action="@{/forgot}" method="post" th:object="${forgotForm}">
        <div th:if="${#fields.hasGlobalErrors()}" class="message-error inl-761d3addb2">
            <ul class="inl-af81c60b31">
                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
            </ul>
        </div>
        <div class="inl-87c136dfd0">
            <label for="email"><b th:text="#{email}">Email:</b></label><br>
            <input type="text" th:field="*{email}" id="email" class="inl-1e02248897">
            <div th:if="${#fields.hasErrors('email')}" class="message-error inl-5e0faad207" th:errors="*{email}"></div>
        </div>
        <button type="submit" th:text="#{get.login.info}" class="inl-bc8c789da3">Get Login Info</button>
        <div th:if="${error}" class="message-error inl-79e2cc521a">
            <p th:text="${error}"></p>
        </div>
    </form>
    <div class="inl-e0281b42d1">
        <a href="/" th:text="#{back.to.login}">Back to Login</a>
    </div>
</div>

<div class="modal-backdrop" th:if="${showSecretModal}">
    <div class="modal-card" th:attr="lang=${#locale.language},dir=${#locale.language}=='ar'?'rtl':'ltr'">
        <h3 class="modal-title" th:text="#{verify.secret.answer}">Verify Secret Answer</h3>
        <form th:action="@{/forgot/verify-secret-answer}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="email" th:value="${verifiedEmail}" />
            <div class="inl-761d3addb2">
                <label><b th:text="#{secret.question}">Secret Question:</b></label>
                <div th:text="${secretQuestion}" class="inl-96ad6099e2"></div>
            </div>
            <div class="inl-761d3addb2">
                <label for="secretAnswer"><b th:text="#{secret.answer}">Secret Answer:</b></label><br>
                <input id="secretAnswer" type="text" name="secretAnswer" class="inl-1e02248897 dialog-input">
            </div>
            <div th:if="${secretError}" class="message-error inl-761d3addb2" th:text="${secretError}"></div>
            <button type="submit" class="inl-bc8c789da3" th:text="#{verify}">Verify</button>
        </form>
    </div>
</div>

<div class="modal-backdrop" th:if="${showResetModal}">
    <div class="modal-card">
            <h3 class="modal-title" th:text="#{change.password}">Reset Password</h3>
        <form th:action="@{/forgot/reset-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="email" th:value="${verifiedEmail}" />
            <div class="inl-761d3addb2">
                            <label for="newPassword"><b th:text="#{new.password}">New Password:</b></label><br>
                        <input id="newPassword" type="password" name="newPassword" class="inl-1e02248897 dialog-input">
                        <div th:if="${newPasswordError}" class="message-error" th:text="${newPasswordError}"></div>
            </div>
            <div class="inl-761d3addb2">
                            <label for="confirmPassword"><b th:text="#{confirm.password}">Confirm Password:</b></label><br>
                        <input id="confirmPassword" type="password" name="confirmPassword" class="inl-1e02248897 dialog-input">
                        <div th:if="${confirmPasswordError}" class="message-error" th:text="${confirmPasswordError}"></div>
            </div>
            <div th:if="${resetError}" class="message-error inl-761d3addb2" th:text="${resetError}"></div>
                <button type="submit" class="inl-bc8c789da3" th:text="#{change.password}">Reset Password</button>
        </form>
    </div>
</div>

</body>
</html>
